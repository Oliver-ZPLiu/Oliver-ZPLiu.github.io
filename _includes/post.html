{% assign gc_code = site.goatcounter.code | default: "" | strip %}
{% if gc_code != "" %}
<div id="page-hit-counter" class="page-hit-counter" data-goatcounter-code="{{ gc_code | escape }}" aria-label="Page view counter">
  <span class="page-hit-counter__label">Page Views</span>
  <span class="page-hit-counter__value" data-goatcounter-count>...</span>
</div>
<script data-goatcounter="https://{{ gc_code }}.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<script>
(function () {
  var zhihuButtons = document.querySelectorAll('[data-zhihu-share]');
  if (!zhihuButtons.length) return;

  function shareText(button) {
    var title = button.getAttribute('data-share-title') || document.title || '';
    var url = button.getAttribute('data-share-url') || window.location.href || '';
    return title + '\n' + url;
  }

  function showCopiedState(button) {
    var original = button.getAttribute('data-original-label');
    if (!original) {
      original = button.textContent.trim();
      button.setAttribute('data-original-label', original);
    }
    button.textContent = 'Copied link';
    window.setTimeout(function () {
      button.textContent = original;
    }, 1800);
  }

  zhihuButtons.forEach(function (button) {
    button.addEventListener('click', function () {
      var text = shareText(button);
      var destination = 'https://zhuanlan.zhihu.com/write';

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () {
          showCopiedState(button);
          window.open(destination, '_blank', 'noopener');
        }).catch(function () {
          window.open(destination, '_blank', 'noopener');
        });
        return;
      }

      window.open(destination, '_blank', 'noopener');
    });
  });
})();
</script>
<script>
(function () {
  var root = document.getElementById('page-hit-counter');
  if (!root) return;

  var countEl = root.querySelector('[data-goatcounter-count]');
  var code = root.getAttribute('data-goatcounter-code');
  if (!countEl || !code) return;

  function currentPath() {
    var p = window.location.pathname || '/';
    if (p.charAt(0) !== '/') p = '/' + p;
    return p;
  }

  var rawPath = currentPath();
  var endpoint = 'https://' + code + '.goatcounter.com/counter/' + encodeURIComponent(rawPath) + '.json';

  fetch(endpoint, {
    headers: { 'Accept': 'application/json' },
    credentials: 'omit'
  })
    .then(function (resp) {
      if (resp.status === 404) {
        countEl.textContent = '0';
        return null;
      }
      if (!resp.ok) throw new Error('counter request failed');
      return resp.json();
    })
    .then(function (data) {
      if (!data) return;
      if (typeof data.count === 'string' && data.count.trim() !== '') {
        countEl.textContent = data.count;
        return;
      }
      var count = Number((data && (data.count || data.total || data.hits)) || 0);
      countEl.textContent = Number.isFinite(count) ? count.toLocaleString() : '0';
    })
    .catch(function () {
      countEl.textContent = '--';
      root.classList.add('is-unavailable');
    });
})();
</script>
<script>
(function () {
  var root = document.getElementById('blog-post-engagement');
  if (!root) return;

  var button = root.querySelector('[data-like-button]');
  var countEl = root.querySelector('[data-like-count]');
  var code = root.getAttribute('data-goatcounter-code');
  if (!button || !countEl || !code) return;

  var labelEl = button.querySelector('.blog-post__like-label');
  var defaultLabel = (labelEl && labelEl.getAttribute('data-like-default-label')) || 'Like';
  var activeLabel = (labelEl && labelEl.getAttribute('data-like-active-label')) || 'Liked';
  var sending = false;

  function currentPath() {
    var p = window.location.pathname || '/';
    if (p.charAt(0) !== '/') p = '/' + p;
    return p.replace(/\/+$/, '') || '/';
  }

  function likePath() {
    return 'like::' + currentPath().replace(/^\//, '').replace(/\//g, '::');
  }

  function counterEndpoint(path) {
    return 'https://' + code + '.goatcounter.com/counter/' + encodeURIComponent(path) + '.json';
  }

  function countEndpoint() {
    return 'https://' + code + '.goatcounter.com/count';
  }

  function storageKey() {
    return 'blog-like:' + likePath();
  }

  function readLikedState() {
    try {
      return window.localStorage && window.localStorage.getItem(storageKey()) === '1';
    } catch (err) {
      return false;
    }
  }

  function persistLikedState() {
    try {
      if (window.localStorage) {
        window.localStorage.setItem(storageKey(), '1');
      }
    } catch (err) {
      // Ignore storage failures.
    }
  }

  function clearLikedState() {
    try {
      if (window.localStorage) {
        window.localStorage.removeItem(storageKey());
      }
    } catch (err) {
      // Ignore storage failures.
    }
  }

  var liked = readLikedState();

  function setLikedState(isLiked) {
    liked = isLiked;
    button.setAttribute('aria-pressed', isLiked ? 'true' : 'false');
    button.classList.toggle('is-liked', isLiked);
    if (labelEl) {
      labelEl.textContent = isLiked ? activeLabel : defaultLabel;
    }
  }

  function setCount(value) {
    countEl.textContent = Number.isFinite(value) ? value.toLocaleString() : '0';
  }

  function rawCount() {
    return Number(String(countEl.textContent || '').replace(/,/g, '')) || 0;
  }

  function loadCount() {
    return fetch(counterEndpoint(likePath()), {
      headers: { 'Accept': 'application/json' },
      credentials: 'omit'
    })
      .then(function (resp) {
        if (resp.status === 404) return null;
        if (!resp.ok) throw new Error('like count request failed');
        return resp.json();
      })
      .then(function (data) {
        if (!data) {
          setCount(0);
          return;
        }
        var count = Number((data && (data.count || data.total || data.hits)) || 0);
        setCount(Number.isFinite(count) ? count : 0);
      })
      .catch(function () {
        countEl.textContent = '--';
        root.classList.add('is-unavailable');
      });
  }

  function waitForGoatcounter(attempt) {
    return new Promise(function (resolve) {
      if (window.goatcounter && typeof window.goatcounter.count === 'function') {
        resolve(true);
        return;
      }

      if (attempt >= 12) {
        resolve(false);
        return;
      }

      window.setTimeout(function () {
        waitForGoatcounter(attempt + 1).then(resolve);
      }, 150);
    });
  }

  function goatcounterPayload() {
    var payload = new URLSearchParams();
    payload.set('p', likePath());
    payload.set('t', 'Like: ' + document.title);
    payload.set('e', 'true');
    return payload;
  }

  function sendWithGoatcounterObject() {
    if (!(window.goatcounter && typeof window.goatcounter.count === 'function')) {
      return false;
    }

    window.goatcounter.count({
      path: likePath(),
      title: 'Like: ' + document.title,
      event: true
    });
    return true;
  }

  function sendDirectRequest() {
    var payload = goatcounterPayload();

    if (navigator.sendBeacon) {
      try {
        var blob = new Blob([payload.toString()], {
          type: 'application/x-www-form-urlencoded; charset=UTF-8'
        });
        if (navigator.sendBeacon(countEndpoint(), blob)) {
          return Promise.resolve(true);
        }
      } catch (err) {
        // Fall through to fetch.
      }
    }

    return fetch(countEndpoint(), {
      method: 'POST',
      headers: {
        'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8'
      },
      body: payload.toString(),
      credentials: 'omit',
      keepalive: true,
      mode: 'cors'
    }).then(function (resp) {
      if (!resp.ok) throw new Error('like event request failed');
      return true;
    });
  }

  function sendLikeEvent() {
    if (sendWithGoatcounterObject()) {
      return Promise.resolve(true);
    }

    return waitForGoatcounter(0).then(function (ready) {
      if (ready && sendWithGoatcounterObject()) {
        return true;
      }
      return sendDirectRequest();
    });
  }

  setLikedState(liked);
  loadCount();

  button.addEventListener('click', function () {
    if (liked || sending) {
      return;
    }

    sending = true;
    button.disabled = true;
    root.classList.remove('is-unavailable');

    var previousCount = rawCount();
    setLikedState(true);
    setCount(previousCount + 1);
    persistLikedState();

    sendLikeEvent()
      .then(function () {
        window.setTimeout(function () {
          loadCount().finally(function () {
            sending = false;
            button.disabled = false;
          });
        }, 1200);
      })
      .catch(function () {
        clearLikedState();
        setLikedState(false);
        setCount(previousCount);
        root.classList.add('is-unavailable');
        sending = false;
        button.disabled = false;
      });
  });
})();
</script>
{% endif %}
